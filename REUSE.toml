version = 1
SPDX-PackageName = "tilo"
SPDX-PackageSupplier = "Wonmor <https://github.com/wonmortech>"
SPDX-PackageDownloadLocation = "https://github.com/wonmortech/tilouz"

[[annotations]]
path = ["*.md", ".github/**/*.md", ".github/ISSUE_TEMPLATE/**", "REUSE.toml", "site/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Wonmor and Tilo contributors"
SPDX-License-Identifier = "Apache-2.0"

# Research and plan documents.
[[annotations]]
path = ["docs/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Wonmor and Tilo contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Channel posts and other written content.
[[annotations]]
path = ["content/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Wonmor and Tilo contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Self-hosted fonts.
[[annotations]]
path = ["site/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "The respective font authors, see site/fonts/"
SPDX-License-Identifier = "OFL-1.1"

# Vendored GSAP (GreenSock standard no-charge licence).
[[annotations]]
path = ["site/js/vendor/**"]
precedence = "override"
SPDX-FileCopyrightText = "GreenSock / Webflow"
SPDX-License-Identifier = "LicenseRef-GSAP-Standard"

# Brand kit: artwork, documents and tokens (see brand/README.md, "Licence and use of the brand").
# The Tilo name and logo stay brand assets; the copyright licence grants no trademark rights.
[[annotations]]
path = ["brand/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Wonmor and Tilo contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Brand code (build scripts and the motion reference implementation).
[[annotations]]
path = ["brand/src/**", "brand/motion/reference/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Wonmor and Tilo contributors"
SPDX-License-Identifier = "Apache-2.0"

# Brand fonts keep their upstream SIL OFL 1.1 licences.
[[annotations]]
path = ["brand/typography/fonts/onest-*.woff2", "brand/typography/fonts/Onest-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021 The Onest Project Authors <https://github.com/simpals/onest>"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["brand/typography/fonts/inter-*.woff2", "brand/typography/fonts/Inter-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors <https://github.com/rsms/inter>"
SPDX-License-Identifier = "OFL-1.1"

# Slide and OG image sources.
[[annotations]]
path = ["tools/deck/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Wonmor and Tilo contributors"
SPDX-License-Identifier = "Apache-2.0"

# Concept demo tooling: npm manifests (JSON cannot carry a header).
[[annotations]]
path = ["package.json", "package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Wonmor and Tilo contributors"
SPDX-License-Identifier = "Apache-2.0"
